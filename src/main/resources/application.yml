spring:
  application:
    name: info-api
  lifecycle:
    # Al recibir SIGTERM (kubectl delete pod) termina las peticiones en curso
    # hasta 10 s antes de apagarse.
    timeout-per-shutdown-phase: 10s

server:
  port: 8080
  shutdown: graceful

taller:
  grupo: "Sistemas Distribuidos - UPTC"
  integrantes:
    - "Nicolas David Castro Cely"
    - "Juan David Márquez Pinto"
    - "Andres Mauricio Sanchez Sanchez"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness y /actuator/health/readiness para las sondas.
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
