apiVersion: apps/v1
kind: Deployment
metadata:
  name: info-api
  namespace: taller
  labels:
    app: info-api
spec:
  # 5 réplicas = una por worker (hay 5 workers). Si un worker se apaga, su pod
  # se recrea en otro y quedan 5 réplicas funcionando en 4 workers.
  replicas: 5
  selector:
    matchLabels:
      app: info-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # al actualizar, nunca baja de 5 pods listos
      maxSurge: 1
  template:
    metadata:
      labels:
        app: info-api
    spec:
      # ---------------------------------------------------------------------
      # Reparto: como máximo 1 pod de diferencia entre un worker y otro.
      # nodeTaintsPolicy: Honor hace que el master (taint control-plane) y los
      # workers caídos (taint unreachable) no cuenten en el cálculo; sin eso,
      # el scheduler dejaría pods en Pending al apagar un worker.
      # ---------------------------------------------------------------------
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: info-api

      # ---------------------------------------------------------------------
      # Por defecto Kubernetes espera 300 s antes de sacar los pods de un nodo
      # caído. Con 30 s la demostración de "apagar un worker" dura ~1,5 min.
      # ---------------------------------------------------------------------
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30

      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001

      containers:
        - name: info-api
          # CAMBIAR: la imagen que publicaron (ver README, paso "Publicar la imagen").
          image: ghcr.io/juanmarquez03-cmd/info-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080

          env:
            - name: TZ
              value: America/Bogota
            # Downward API: Kubernetes le cuenta al contenedor quién es y dónde corre.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: info-api
                  resource: limits.memory
            - name: STORAGE_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: info-api
                  resource: limits.ephemeral-storage

          # Los workers tienen ~1,6 GB de RAM: estos valores dejan espacio para
          # 3 pods por nodo cuando otro worker está apagado.
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: "1"
              memory: 384Mi
              ephemeral-storage: 512Mi

          # startupProbe: da hasta 3 min para arrancar (las VMs son lentas) antes
          # de que empiecen a contar las otras dos sondas.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # livenessProbe: si la app se cuelga, el kubelet reinicia el contenedor.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # readinessProbe: el Service solo envía tráfico a pods que responden.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 2
